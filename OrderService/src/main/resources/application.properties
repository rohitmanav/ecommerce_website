spring.application.name=orderservice
server.port=${SERVER_PORT:8084}

# for database connection
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/orderservice?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:12345}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# service discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# kafka: publishes order_created, order_status_updates, order emails and SMS; listens to payment_events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.group-id=orderService
spring.kafka.consumer.auto-offset-reset=earliest

# how long checkout waits for the payment service to return a payment link
app.checkout.payment-link-wait-ms=4000
app.mail.from=${MAIL_FROM:no-reply@ecommerce.local}

# swagger
app.gateway-url=${GATEWAY_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
