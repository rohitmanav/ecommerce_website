spring.application.name=cartservice
server.port=${SERVER_PORT:8083}

# mongodb stores carts
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cartservice}
spring.data.mongodb.auto-index-creation=true

# service discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# redis cache for carts
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false

# kafka: publishes cart events, listens for placed orders to empty the cart
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.group-id=cartService
spring.kafka.consumer.auto-offset-reset=earliest

app.cart.max-quantity-per-item=10

# swagger
app.gateway-url=${GATEWAY_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.health.redis.enabled=false
