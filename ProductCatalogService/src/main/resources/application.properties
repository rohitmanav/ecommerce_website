spring.application.name=productservice
server.port=${SERVER_PORT:8082}

# for database connection
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/productcatalogservice?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:12345}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# service discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# redis cache for product details
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false

# elasticsearch for product search
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
spring.elasticsearch.connection-timeout=1s
spring.elasticsearch.socket-timeout=5s
spring.data.elasticsearch.repositories.enabled=false

# fill the catalog with sample data on first start
app.seed-data=${SEED_DATA:true}

# swagger
app.gateway-url=${GATEWAY_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.health.redis.enabled=false
management.health.elasticsearch.enabled=false
