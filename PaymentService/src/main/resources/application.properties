spring.application.name=paymentservice
server.port=${SERVER_PORT:8085}

# for database connection
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/paymentservice?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:12345}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# service discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# kafka: listens to order_created, publishes payment_events and receipt emails/SMS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.group-id=paymentService
spring.kafka.consumer.auto-offset-reset=earliest

# payment gateway: auto (Razorpay when keys are set, otherwise mock), razorpay, stripe or mock
payment.gateway=${PAYMENT_GATEWAY:auto}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
stripe.apikey=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# public URL the customer's browser returns to after paying (through the gateway)
app.payment.callback-base-url=${PAYMENT_CALLBACK_BASE_URL:http://localhost:8080}
app.payment.link-expiry-minutes=60
app.mail.from=${MAIL_FROM:no-reply@ecommerce.local}

# swagger
app.gateway-url=${GATEWAY_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
