spring.application.name=notificationservice
server.port=${SERVER_PORT:8086}

# service discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# kafka: listens to signup, password_reset, order_notifications, payment_notifications and sms_notifications
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notificationService
spring.kafka.consumer.auto-offset-reset=earliest

# SMTP: Gmail (smtp.gmail.com + app password) or Amazon SES (email-smtp.<region>.amazonaws.com + SMTP credentials).
# Leave MAIL_USERNAME empty to only log emails instead of sending them.
app.mail.host=${MAIL_HOST:smtp.gmail.com}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
# sender address; defaults to MAIL_USERNAME (Gmail requires the authenticated account, SES a verified sender)
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:E-Commerce Store}
app.notifications.history-size=100

# SMS: "log" only writes messages to the log; "twilio" sends them (falls back to log without credentials)
app.sms.provider=${SMS_PROVIDER:log}
app.sms.default-country-code=${SMS_DEFAULT_COUNTRY_CODE:+91}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# swagger
app.gateway-url=${GATEWAY_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
