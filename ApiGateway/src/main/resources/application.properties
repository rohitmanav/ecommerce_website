spring.application.name=apigateway
server.port=${SERVER_PORT:8080}

# service discovery: routes use lb://<service-name>
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# redis backs the rate limiter; if Redis is down requests are allowed through
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
management.health.redis.enabled=false

# per client IP: steady requests per second and short burst allowance
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.replenish-rate=20
app.rate-limit.burst-capacity=40

# browser front-ends allowed to call the API
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# combined swagger UI at /swagger-ui.html, one entry per service
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=User & Authentication
springdoc.swagger-ui.urls[0].url=/userservice/v3/api-docs
springdoc.swagger-ui.urls[1].name=Product Catalog
springdoc.swagger-ui.urls[1].url=/productservice/v3/api-docs
springdoc.swagger-ui.urls[2].name=Cart
springdoc.swagger-ui.urls[2].url=/cartservice/v3/api-docs
springdoc.swagger-ui.urls[3].name=Orders
springdoc.swagger-ui.urls[3].url=/orderservice/v3/api-docs
springdoc.swagger-ui.urls[4].name=Payments
springdoc.swagger-ui.urls[4].url=/paymentservice/v3/api-docs
springdoc.swagger-ui.urls[5].name=Notifications
springdoc.swagger-ui.urls[5].url=/notificationservice/v3/api-docs
springdoc.swagger-ui.urls-primary-name=Product Catalog

management.endpoints.web.exposure.include=health,info,gateway
