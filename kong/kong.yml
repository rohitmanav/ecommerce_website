# Kong (DB-less) in front of the Spring Cloud Gateway instances.
# Plays the "Load Balancer + API Gateway (Kong)" role from the HLD:
#   client -> Kong :8000 -> round-robin over healthy gateway instances (:8080, :8090) -> services
# Start with:  docker compose --profile edge up -d
_format_version: "3.0"
_transform: true

upstreams:
  - name: api-gateway-cluster
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /actuator/health
        timeout: 2
        healthy:
          interval: 5
          successes: 1
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
      passive:
        healthy:
          successes: 1
        unhealthy:
          http_failures: 3
          tcp_failures: 2
          timeouts: 2
    targets:
      - target: host.docker.internal:8080
        weight: 100
      - target: host.docker.internal:8090
        weight: 100

services:
  - name: ecommerce-api
    host: api-gateway-cluster
    port: 8080
    protocol: http
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    retries: 2
    routes:
      - name: ecommerce-api-route
        paths:
          - /
        strip_path: false
    plugins:
      # per client IP; Kong sees the real client address, the gateways behind it only see Kong
      - name: rate-limiting
        config:
          second: 20
          minute: 600
          policy: local
          limit_by: ip
      - name: correlation-id
        config:
          header_name: X-Request-Id
          generator: uuid
          echo_downstream: true
