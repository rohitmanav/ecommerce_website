spring.application.name=userservice
server.port=${SERVER_PORT:8081}

# for database connection
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/userauthservice?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:12345}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# service discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# kafka: publishes signup and password reset emails, listens to order_status_updates
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.group-id=userService
spring.kafka.consumer.auto-offset-reset=earliest

# jwt
jwt.secret=${JWT_SECRET:scaler-ecommerce-local-development-secret-key-change-me}
jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
jwt.refresh-token-validity-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:604800}

# password reset
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:8080/reset-password}
app.password-reset.token-validity-minutes=15
app.password-reset.log-link=${PASSWORD_RESET_LOG_LINK:true}

# emails
app.mail.from=${MAIL_FROM:no-reply@ecommerce.local}

# admin account created on first start
app.admin.email=${ADMIN_EMAIL:admin@ecommerce.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=Store Admin

# google sign-in (leave empty to accept any Google client id)
google.client-id=${GOOGLE_CLIENT_ID:}

# swagger
app.gateway-url=${GATEWAY_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
